<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#732f43">
  <meta name="description" content="公式規定をもとに、ワインの呼称・地域・品種を探索する Appellation Explorer。">
  <title>Appellation Explorer</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module">
    import('./app.js').catch(() => {
      const main = document.getElementById('main');
      main.replaceChildren();
      const message = document.createElement('p');
      message.textContent = 'アプリを読み込めませんでした / Unable to load the app.';
      const retry = document.createElement('button');
      retry.textContent = '再読み込み / Reload';
      retry.addEventListener('click', () => location.reload());
      main.append(message, retry);
    });
  </script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ / Skip to content</a>
  <header id="header"></header>
  <main id="main" tabindex="-1"><p role="status">データを読み込んでいます / Loading data…</p></main>
  <dialog id="sheet" aria-label="条件を編集 / Edit condition"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>この検索・探索アプリにはJavaScriptが必要です。 / JavaScript is required for this explorer.</noscript>
</body>
</html>
